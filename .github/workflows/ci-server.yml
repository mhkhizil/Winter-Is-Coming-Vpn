name: ci-server

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-13 / release / -Werror
            cc: gcc-13
            cxx: g++-13
            preset: default
          - name: clang-18 / debug / asan+ubsan
            cc: clang-18
            cxx: clang++-18
            preset: debug
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-13 g++-13 clang-18 ninja-build cmake clang-format-18
          cmake --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel "$(nproc)"

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }}

      # Formatting is reported but not gated yet: the sources are hand-formatted to
      # the 100-column Google style, not clang-format-clean. Rule: flip this to a
      # hard gate only after 'cmake --build --preset default --target format' has
      # been run once on main, otherwise every PR fails for whitespace.
      - name: Formatting report (non-blocking)
        if: matrix.preset == 'default'
        continue-on-error: true
        run: cmake --build --preset default --target format-check

  hygiene:
    name: hygiene gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: No GPL code copied into the tree
        run: |
          # wireguard-tools / wireguard.ko are GPL-2.0. They may be *invoked* in
          # tests, never vendored. See NOTICE and third_party/wg-test-vectors.
          if grep -rIl --exclude-dir=.git --exclude=NOTICE --exclude=README.md \
            -e 'SPDX-License-Identifier: GPL' . ; then
            echo "::error::GPL-licensed file found in the repository"; exit 1
          fi

      - name: No non-constant-time comparison of secret material
        run: |
          # memcmp/strcmp on key material is banned; vpn::ct::equal is the only
          # approved primitive (docs/THREAT_MODEL.md §4).
          if grep -rn --include='*.cpp' --include='*.hpp' \
            -e 'memcmp *(' server/src server/include ; then
            echo "::error::memcmp() found in server code; use vpn::ct::equal"; exit 1
          fi

      - name: No client private keys in the schema or code
        run: |
          if grep -rniE 'private_key[_ ]*(text|bytea|varchar)' server/migrations ; then
            echo "::error::the schema must never be able to store a client private key (ADR-0007)"; exit 1
          fi

      - name: systemd units must match what the binaries actually implement
        run: |
          # A unit that asks systemd for readiness notification or reload support
          # that the binary does not implement either hangs at startup (Type=notify
          # without sd_notify) or silently no-ops (ExecReload without SIGHUP).
          #
          # Scope is self-tightening: a unit is gated strictly only once the source
          # for its binary exists. vpnd is gated today; vpn-datad is reported as a
          # warning until server/src/dataplane/main.cpp lands at M2, at which point
          # this step starts failing on it unless the unit is fixed.
          fail=0
          check_unit() {
            unit="$1"; src="$2"; label="$3"
            [ -e "$unit" ] || return 0
            sev="::error"
            if [ -z "$(ls -A "$(dirname "$src")" 2>/dev/null | grep -v README)" ]; then
              sev="::warning"   # component not implemented yet (M2+)
            fi
            if grep -qE '^Type=notify' "$unit" && ! grep -rqE 'sd_notify' server/src ; then
              echo "$sev file=$unit::$label unit uses Type=notify but no sd_notify() call exists in server/src"
              if [ "$sev" = "::error" ]; then fail=1; fi
            fi
            if grep -qE '^ExecReload=' "$unit" && ! grep -rqE 'SIGHUP' server/src ; then
              echo "$sev file=$unit::$label unit sets ExecReload but no SIGHUP handler exists in server/src"
              if [ "$sev" = "::error" ]; then fail=1; fi
            fi
          }
          check_unit deploy/systemd/vpnd.service        server/src/controlplane/main.cpp "vpnd"
          check_unit deploy/systemd/vpn-datad.service   server/src/dataplane/main.cpp    "vpn-datad"
          exit $fail

      - name: Documented vpnd flags exist in the binary
        run: |
          # A flag that docs tell operators to pass must be parsed by main.cpp;
          # a documented flag that is silently ignored is a P1 defect.
          fail=0
          for f in --config --bind --metrics-bind --log-level --print-config \
            --validate-config --print-version --help ; do
            if grep -rq -- "$f" docs/ README.md CONTRIBUTING.md SECURITY.md 2>/dev/null ; then
              if ! grep -q -- "\"$f\"" server/src/controlplane/main.cpp ; then
                echo "::error::docs reference $f but main.cpp does not parse it"
                fail=1
              fi
            fi
          done
          exit $fail

      - name: Docs links and structure
        run: python3 scripts/check_docs.py

      - name: Docs claims (links, ADR shape, forbidden terms, key material)
        run: echo "covered by .github/workflows/docs-lint.yml"

  docker:
    name: container build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build vpnd image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.vpnd
          push: false
          load: true
          tags: vpn/vpnd:ci
      - name: Smoke test the image
        run: |
          docker run -d --name vpnd-ci -p 8080:8080 vpn/vpnd:ci --bind 0.0.0.0:8080
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/metrics | head -n 20
          docker rm -f vpnd-ci
