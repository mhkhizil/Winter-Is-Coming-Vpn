#
# Android build lane. This exists because the development machine has no JDK, no
# Android SDK and no NDK: the only place an APK is actually proven to compile and
# the JVM tests actually run is here.
name: ci-android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/ci-android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/ci-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: assemble + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repository has no gradle wrapper (its jar is a binary we do not commit),
      # so the action installs a pinned distribution and puts `gradle` on PATH.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null

      - name: Unit tests (contract parsing, no emulator needed)
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-tests
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: winter-vpn-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
