#
# Edge proxy: TLS 1.3 termination for the vpnd control plane (ADR-0009).
#
# Why the proxy terminates TLS instead of vpnd:
#   * compatibility - every client (browsers, curl, official SDKs, mobile OS HTTP
#     stacks) sees a normal TLS endpoint with HTTP/2/HTTP/3; an in-process stack
#     written from scratch would be the only one in the industry doing that
#   * performance   - handshakes happen in nginx's event loop with session
#     resumption and (kernel 5.19+) kTLS, so vpnd's worker threads only ever see
#     plaintext HTTP on a private socket
#   * attack surface - vpnd contains no TLS/X.509 parser, which is the layer with
#     the worst bug history on the internet
#
# vpnd must be started with:
#   [http] bind = "127.0.0.1:8080"          # never a public interface
#   [tls]
#   terminated_by_proxy = true
#   require_https = true                    # 403 for anything that skipped us
#   trusted_proxies = ["127.0.0.1/32"]      # exactly the proxy's source address
#
# Test with the TlsPolicy tests in server/tests/unit/test_http_server.cpp (they
# assert the 403, the exemptions, the untrusted-peer case and the HSTS header).

worker_processes auto;
events { worker_connections 4096; }

http {
  server_tokens off;
  # X-Forwarded-Proto must never be forwarded from the client side: it is
  # overwritten below, which is what makes vpnd's trusted-proxy check sound.
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Host $host;

  # TLS 1.3 only. 1.2 is still needed by some corporate middleboxes; drop this
  # line to allow it.
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;          # forward secrecy across restarts
  ssl_stapling on;
  ssl_stapling_verify on;

  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

  upstream vpnd_api {
    server 127.0.0.1:8080;
    keepalive 32;
  }

  server {
    listen 80;
    listen [::]:80;
    # ACME HTTP-01 challenge stays on cleartext; everything else is redirected.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate     /etc/letsencrypt/live/vpn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/vpn.example.com/chain.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    # Login is the only endpoint worth brute-forcing.
    location = /api/v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://vpnd_api;
    }

    location /api/ {
      proxy_pass http://vpnd_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 15s;
    }

    # Health and metrics are answered by vpnd itself and are exempt from
    # tls.require_https, so they can also be scraped over the private network.
    location = /healthz { proxy_pass http://vpnd_api; }
    location = /readyz  { proxy_pass http://vpnd_api; }

    # The metrics listener is a separate port on purpose (it is scraped from the
    # monitoring network, not the internet). Do not expose it here.
    location = /metrics { return 404; }
  }
}
